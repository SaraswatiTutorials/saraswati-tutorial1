<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel 2 | Tutor pipeline</title>
<script>
  // Dark mode is switched off, matching the rest of the site. To turn it back on,
  // set this to true: the dark colours below and the Theme button are still here.
  window.PANEL_DARK_MODE_ENABLED = false;
  try {
    const t = localStorage.getItem("panel2-theme");
    if (window.PANEL_DARK_MODE_ENABLED && t) document.documentElement.dataset.theme = t;
  } catch {}
</script>
<style>
  @font-face {
    font-family: "Plus Jakarta Sans"; src: url("/panel2/assets/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 800; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #f3f5f9; --surface: #ffffff; --surface-2: #f8fafc; --line: #e3e8ef; --line-soft: #eef1f6;
    --ink: #141b2d; --ink-2: #39435a; --mut: #667085; --faint: #98a2b3;
    --accent: #1d63dc; --accent-dark: #174fb0; --accent-soft: #e8f0fe;
    --ok: #0f7b45; --ok-soft: #e4f6ec; --ok-mark: #16a34a;
    --warn: #a15c00; --warn-soft: #fdf1dc; --warn-mark: #f59e0b;
    --bad: #c9271b; --bad-soft: #fdecea; --bad-mark: #dc2626;
    --violet: #6d3fd6; --violet-soft: #f0eafd; --teal: #0b7f8c; --teal-soft: #e2f5f7; --grey-soft: #eef1f5;
    --radius: 14px; --side-w: 256px; --bar-h: 68px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 6px rgba(16, 24, 40, .04);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --surface: #1b1f27; --surface-2: #222730; --line: #333945; --line-soft: #2a2f39;
    --ink: #e8eaee; --ink-2: #c8ccd4; --mut: #9aa3b0; --faint: #79818e;
    --accent: #7fb0f5; --accent-dark: #a3c6f7; --accent-soft: #1e2c42;
    --ok: #6fce9a; --ok-soft: #1a2d24; --warn: #e8bb62; --warn-soft: #2f2816; --bad: #f28d85; --bad-soft: #371f1e;
    --violet: #b9a1f2; --violet-soft: #2a2340; --teal: #6ccbd6; --teal-soft: #17302f; --grey-soft: #2a2f39;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 500 15px/1.55 "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  a { color: var(--accent); }
  svg { flex-shrink: 0; display: block; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3, p, dl, dd, ol, ul { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .mut { color: var(--mut); }
  .small { font-size: 13.5px; }

  /* ---------- Controls ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 7px 16px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 14.5px; white-space: nowrap; transition: background .15s, border-color .15s; }
  .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--faint); }
  .btn:disabled { color: var(--faint); background: var(--surface-2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn-send { background: var(--bad-mark); border-color: var(--bad-mark); color: #fff; }
  .btn-send:hover:not(:disabled) { background: #b91c1c; border-color: #b91c1c; }
  .btn-send:disabled, .btn-primary:disabled { background: var(--grey-soft); border-color: var(--line); color: var(--faint); }
  .icon-btn { width: 42px; height: 42px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink-2); }
  .icon-btn:hover { background: var(--surface-2); }
  .input, .select { height: 42px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; font-size: 14.5px; }
  .input:focus, .select:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }

  /* ---------- Sign in ---------- */
  .login { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 520px); background: var(--surface); }
  .login-art { background: #1d2329 url("/panel2/assets/login-hero.jpg") center / cover no-repeat; }
  .login-side { display: flex; flex-direction: column; justify-content: center; padding: 40px; }
  .login-form { width: 100%; max-width: 380px; margin: 0 auto; }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
  .login-brand img { width: 46px; height: 46px; }
  .login-brand b { display: block; font-size: 17px; font-weight: 700; }
  .login h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field .input { width: 100%; height: 46px; }
  .pw { position: relative; }
  .pw .input { padding-right: 64px; }
  .pw button { position: absolute; right: 6px; top: 6px; height: 34px; padding: 0 10px; border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 13.5px; }
  .caps { color: var(--warn); font-size: 13.5px; margin-top: 5px; }
  .login .btn-primary { width: 100%; height: 46px; font-size: 15px; }
  .form-err { color: var(--bad); margin-top: 12px; min-height: 22px; }
  @media (max-width: 860px) {
    .login { grid-template-columns: 1fr; }
    .login-art { display: none; }
    .login-side { padding: 24px 16px; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--side-w); display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); z-index: 30; transition: transform .2s ease; }
  .side-brand { display: flex; align-items: center; gap: 10px; height: var(--bar-h); padding: 0 18px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .side-brand img { width: 38px; height: 38px; }
  .side-brand b { display: block; font-size: 15.5px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
  .side-brand span { font-size: 13px; color: var(--mut); font-weight: 500; }
  .queues { flex: 1; overflow-y: auto; padding: 14px 12px; }
  .queues .group { font-size: 12.5px; font-weight: 700; color: var(--faint); padding: 10px 10px 6px; }
  .queues button { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 11px; margin-bottom: 3px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-weight: 600; text-align: left; font-size: 14.5px; }
  .queues button svg { color: var(--mut); }
  .queues button:hover { background: var(--surface-2); }
  .queues button[aria-current="true"] { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(29, 99, 220, .25); }
  .queues button[aria-current="true"] svg { color: #fff; }
  .queues .label { flex: 1; min-width: 0; }
  .queues .n { min-width: 26px; padding: 1px 7px; border-radius: 999px; background: var(--grey-soft); color: var(--mut); font-size: 12.5px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .queues button[aria-current="true"] .n { background: rgba(255, 255, 255, .22); color: #fff; }
  .queues .has-problem .n { background: var(--bad-soft); color: var(--bad); }
  .queues .has-problem[aria-current="true"] .n { background: rgba(255, 255, 255, .22); color: #fff; }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 25; }

  .main { margin-left: var(--side-w); min-width: 0; transition: margin-left .2s ease; }
  body.nav-collapsed .sidebar { transform: translateX(-100%); }
  body.nav-collapsed .main { margin-left: 0; }
  @media (max-width: 1099px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; }
    body.nav-open .sidebar { transform: none; box-shadow: 0 10px 40px rgba(15, 23, 42, .25); }
    body.nav-open .scrim { display: block; }
    body.nav-open { overflow: hidden; }
  }

  /* ---------- Top bar ---------- */
  .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; height: var(--bar-h); padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar-search { flex: 0 1 400px; min-width: 120px; }
  .bar-search .input { width: 100%; background: var(--surface-2); }
  .bar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; white-space: nowrap; }
  .updated { color: var(--mut); font-size: 13.5px; }
  .user { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  @media (max-width: 860px) {
    .bar { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
    .user-name, .updated { display: none; }
    .bar-search { flex: 1 1 100%; order: 3; }
  }

  .avatar { display: inline-grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; font-size: 14px; font-weight: 700; }
  .av-0 { background: var(--accent-soft); color: var(--accent); }
  .av-1 { background: var(--ok-soft); color: var(--ok); }
  .av-2 { background: var(--warn-soft); color: var(--warn); }
  .av-3 { background: var(--violet-soft); color: var(--violet); }
  .av-4 { background: var(--teal-soft); color: var(--teal); }

  /* ---------- Page ---------- */
  .content { padding: 22px 24px 32px; }
  @media (max-width: 860px) { .content { padding: 14px 12px 24px; } }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 24px; margin-bottom: 18px; }
  .page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; }
  .crumb { color: var(--mut); font-size: 14px; }
  .notice { padding: 11px 14px; margin-bottom: 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .notice.err { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  .notice.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }

  .modes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .modes > span { padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; white-space: nowrap; color: var(--ink-2); }
  .modes b { font-weight: 600; }
  .modes .warning { white-space: normal; background: var(--bad-soft); border-color: transparent; }
  @media (max-width: 560px) { .modes > span { white-space: normal; border-radius: 10px; } }
  .on { color: var(--ok); font-weight: 700; } .off { color: var(--mut); font-weight: 700; } .alarm { color: var(--bad); font-weight: 700; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }

  /* Summary: the six numbers, then the two charts */
  .overview { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 18px; align-items: stretch; }
  @media (max-width: 1799px) { .overview { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stats { grid-column: 1 / -1; } }
  @media (max-width: 860px) { .overview { grid-template-columns: minmax(0, 1fr); } }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 860px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
  .stat { display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0; }
  .stat .tile { width: 46px; height: 46px; display: grid; place-items: center; flex-shrink: 0; border-radius: 50%; color: #fff; }
  .stat .label { color: var(--ink-2); font-size: 14px; font-weight: 600; }
  .stat .value { font-size: 29px; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .sub { color: var(--mut); font-size: 13.5px; margin-top: 3px; overflow-wrap: anywhere; }
  .stat .sub .bad { color: var(--bad); font-weight: 700; }
  .st-blue { background: linear-gradient(120deg, #edf3fe, var(--surface) 75%); } .st-blue .tile { background: #2f6fe4; }
  .st-violet { background: linear-gradient(120deg, #f3eefe, var(--surface) 75%); } .st-violet .tile { background: #7c4fe0; }
  .st-teal { background: linear-gradient(120deg, #e6f7f9, var(--surface) 75%); } .st-teal .tile { background: #0e97a6; }
  .st-green { background: linear-gradient(120deg, #e8f8ef, var(--surface) 75%); } .st-green .tile { background: #1fa45c; }
  .st-amber { background: linear-gradient(120deg, #fef5e4, var(--surface) 75%); } .st-amber .tile { background: #ea920f; }
  .st-pink { background: linear-gradient(120deg, #fdeef7, var(--surface) 75%); } .st-pink .tile { background: #d9469f; }
  @media (max-width: 480px) {
    .stat { flex-direction: column; gap: 8px; padding: 13px; }
    .stat .tile { width: 38px; height: 38px; }
    .stat .value { font-size: 24px; }
  }

  .chart { padding: 18px 20px; display: flex; flex-direction: column; }
  .chart h3 { font-size: 16px; font-weight: 700; }
  .chart .note { color: var(--mut); font-size: 13.5px; margin-bottom: 12px; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 150px; flex: 1; min-height: 130px; border-bottom: 1px solid var(--line); margin-top: 18px; }
  .bars .day { position: relative; flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border-radius: 4px; }
  .bars .val { font-size: 13px; font-weight: 700; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .bars .fill { width: min(100%, 34px); min-height: 2px; background: var(--accent); border-radius: 4px 4px 0 0; transition: filter .15s; }
  .bars .day.zero .fill { background: var(--line); }
  .bars .day:hover .fill { filter: brightness(.85); }
  .bars .tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); z-index: 3; padding: 4px 9px; border-radius: 7px; background: var(--ink); color: var(--surface); font-size: 13px; white-space: nowrap; }
  .bars .day:hover .tip, .bars .day:focus-visible .tip { display: block; }
  .bars-x { display: flex; gap: 8px; margin-top: 6px; color: var(--mut); font-size: 12.5px; }
  .bars-x span { flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; }

  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; flex: 1; }
  .donut { position: relative; width: 136px; height: 136px; flex-shrink: 0; }
  .donut .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
  .donut .mid b { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .donut .mid span { color: var(--mut); font-size: 12.5px; }
  .legend { flex: 1 1 130px; min-width: 130px; }
  .legend li { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .legend .name { flex: 1; color: var(--ink-2); }
  .legend b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .legend .pct { color: var(--mut); font-size: 13px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .filters label { display: inline-flex; align-items: center; gap: 7px; color: var(--mut); font-size: 14px; font-weight: 600; }
  .filters .select { color: var(--ink); }
  .filters .shown { margin-left: auto; color: var(--mut); font-size: 14px; }
  @media (max-width: 860px) { .filters .shown { margin-left: 0; flex-basis: 100%; } }

  /* ---------- List and detail ---------- */
  .workspace { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .list-pane { overflow-x: auto; container-type: inline-size; }
  .detail-pane { position: sticky; top: calc(var(--bar-h) + 14px); max-height: calc(100vh - var(--bar-h) - 28px); overflow-y: auto; container-type: inline-size; }
  /* Below this width the table takes the page and details slide in from the right. */
  .detail-scrim { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 35; }
  @media (max-width: 1799px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .detail-pane { display: none; }
    body.detail-open { overflow: hidden; }
    body.detail-open .detail-scrim { display: block; }
    body.detail-open .detail-pane { display: block; position: fixed; inset: 0 0 0 auto; width: min(780px, 100vw); z-index: 40; max-height: none; border: 0; border-radius: 0; box-shadow: -10px 0 40px rgba(15, 23, 42, .2); }
  }

  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: 700; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 12px 16px; white-space: nowrap; }
  td { padding: 13px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }

  .list tbody tr { cursor: pointer; transition: background .12s; }
  .list tbody tr:hover td { background: var(--surface-2); }
  .list tbody tr[aria-selected="true"] td { background: var(--accent-soft); }
  .list .person { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .list .who { font-weight: 700; }
  .list .sub { color: var(--mut); font-size: 13.5px; }
  .list .who, .list .sub { overflow-wrap: anywhere; }
  .list .count-yes { color: var(--ok); font-weight: 700; }
  /* Columns leave by how wide the table really is, so none is ever cut off. All of it is in the details too. */
  @container (max-width: 880px) { .col-area { display: none; } }
  @container (max-width: 700px) { .col-time { display: none; } }
  @container (max-width: 540px) { .col-class, .col-count { display: none; } }
  @container (max-width: 360px) {
    .list td, .list th { padding-left: 10px; padding-right: 10px; }
    .list .status { white-space: normal; }
    .list .avatar { display: none; }
  }
  .empty-row { padding: 36px 16px; text-align: center; color: var(--mut); }
  .empty-row b { display: block; color: var(--ink); }

  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 999px; white-space: nowrap; font-size: 13.5px; font-weight: 600; }
  .status::before { content: ""; width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; background: currentColor; }
  .s-act { color: var(--accent); background: var(--accent-soft); } .s-wait { color: var(--warn); background: var(--warn-soft); }
  .s-ok { color: var(--ok); background: var(--ok-soft); } .s-bad { color: var(--bad); background: var(--bad-soft); } .s-none { color: var(--mut); background: var(--grey-soft); }
  .test-mark { margin-left: 6px; padding: 0 6px; border-radius: 5px; background: var(--warn-soft); color: var(--warn); font-size: 12px; font-weight: 700; }

  /* Detail */
  .d-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .d-head .avatar { width: 46px; height: 46px; font-size: 15px; }
  .d-head h2 { font-size: 19px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; letter-spacing: -.01em; }
  .d-head .id { color: var(--mut); font-size: 13.5px; }
  .d-title { flex: 1; min-width: 0; }
  .d-back { display: none; }
  @media (max-width: 1799px) { .d-back { display: inline-flex; } }
  .sec { padding: 18px 20px; border-bottom: 1px solid var(--line-soft); }
  .sec:last-child { border-bottom: 0; }
  .sec > h3 { font-size: 16px; font-weight: 700; margin-bottom: 11px; }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
  .facts dt { color: var(--mut); font-size: 13.5px; }
  .facts dd { font-weight: 600; overflow-wrap: anywhere; }
  @container (max-width: 480px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .alert { padding: 10px 13px; margin-top: 10px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); }
  .alert.wait { background: var(--warn-soft); color: var(--warn); }
  .alert.fine { background: var(--ok-soft); color: var(--ok); }
  .alert.plain { background: var(--surface-2); color: var(--ink-2); }

  /* Steps */
  .steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; padding: 13px 0; border-top: 1px solid var(--line-soft); }
  .steps li:first-child { border-top: 0; padding-top: 2px; }
  .steps .no { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--grey-soft); font-size: 14px; font-weight: 700; color: var(--mut); }
  .steps .is-done .no { background: var(--ok-soft); color: var(--ok); }
  .steps .is-next .no { background: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
  .steps .is-failed .no { background: var(--bad-soft); color: var(--bad); }
  .steps .t { font-weight: 700; }
  .steps .is-next .t { color: var(--accent); }
  .steps .res { color: var(--ink-2); overflow-wrap: anywhere; }
  .steps .why { color: var(--mut); font-size: 13.5px; }
  .steps .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  @container (max-width: 460px) {
    .steps li { grid-template-columns: 34px minmax(0, 1fr); }
    .steps .acts { grid-column: 2; align-items: flex-start; margin-top: 6px; }
    .steps .acts .btn { white-space: normal; }
  }

  /* Preview */
  .preview { border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; scroll-margin-top: 90px; overflow: hidden; }
  .preview-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 700; }
  .preview-body { padding: 13px 14px; }
  .preview-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); background: var(--surface-2); }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; }
  .kv dt { color: var(--mut); }
  .kv dd { overflow-wrap: anywhere; font-weight: 600; }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; padding: 11px 13px; margin-top: 10px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 10px; font-size: 14px; }
  .sub-h { font-weight: 700; margin: 12px 0 4px; }
  .plain-list li { padding: 2px 0; }

  /* Tutors */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; overflow-x: auto; }
  .tabs button { padding: 8px 13px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--mut); font-weight: 600; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .meta { color: var(--mut); font-size: 13.5px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .meta .bad { color: var(--bad); font-weight: 700; }
  .sec .note { padding: 8px 11px; margin-bottom: 8px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); font-size: 13.5px; }
  .none { color: var(--mut); padding: 8px 0; }
  .t-wrap { overflow-x: auto; }
  .tbl th, .tbl td { padding: 9px 10px; vertical-align: top; }
  .tbl th { background: transparent; }
  .tbl th:first-child, .tbl td:first-child { padding-left: 0; }
  .tbl .name { font-weight: 700; }
  .tbl .sub { color: var(--mut); font-size: 13.5px; }
  .tbl .err { color: var(--bad); font-size: 13.5px; max-width: 240px; }
  @container (max-width: 560px) {
    .tbl thead { display: none; }
    .tbl, .tbl tbody, .tbl tr { display: block; }
    .tbl tr { padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
    .tbl tr:last-child { border-bottom: 0; }
    .tbl td { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; border: 0; text-align: right; }
    .tbl td::before { content: attr(data-label); color: var(--mut); font-size: 13.5px; text-align: left; flex-shrink: 0; }
    .tbl td:first-child { display: block; text-align: left; }
    .tbl td:first-child::before { display: none; }
  }
  .d-empty { padding: 70px 24px; text-align: center; color: var(--mut); }
  .d-empty b { display: block; color: var(--ink); font-size: 16px; }
  .loading { padding: 36px 16px; text-align: center; color: var(--mut); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main id="loginView" class="login">
  <div class="login-art" aria-hidden="true"></div>
  <section class="login-side">
    <form class="login-form" onsubmit="event.preventDefault(); login();" novalidate>
      <div class="login-brand">
        <img src="/panel2/assets/logo.png" alt="">
        <div><b>Saraswati Tutorials</b><span class="mut">Panel 2: Tutor pipeline</span></div>
      </div>
      <h1>Sign in</h1>
      <div class="field">
        <label for="u">Id</label>
        <input id="u" class="input" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="p">Password</label>
        <div class="pw">
          <input id="p" class="input" type="password" autocomplete="current-password">
          <button type="button" id="reveal" onclick="toggleReveal()" aria-controls="p" aria-pressed="false">Show</button>
        </div>
        <div class="caps" id="caps" hidden>Caps Lock is on</div>
      </div>
      <button id="loginBtn" class="btn btn-primary" type="submit">Sign in</button>
      <div id="loginMsg" class="form-err" role="alert"></div>
    </form>
  </section>
</main>

<div id="boardView" hidden>
  <aside class="sidebar" aria-label="Main menu">
    <div class="side-brand">
      <img src="/panel2/assets/logo.png" alt="">
      <div><b>Saraswati Tutorials</b><span>Tutor pipeline</span></div>
    </div>
    <nav class="queues" id="queues" aria-label="Enquiry queues"></nav>
  </aside>
  <div class="scrim" onclick="closeNav()"></div>

  <div class="main">
    <header class="bar">
      <button class="icon-btn" id="navBtn" onclick="toggleNav()" aria-label="Show or hide the menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <label class="bar-search">
        <span class="sr">Search enquiries</span>
        <input class="input js-search" id="search" type="search" placeholder="Search parent, phone, ID, area" autocomplete="off">
      </label>
      <div class="bar-right">
        <span class="updated" id="updated"></span>
        <button class="btn" id="refreshBtn" onclick="load()">Refresh</button>
        <button class="btn" id="themeBtn" onclick="toggleTheme()" hidden>Theme</button>
        <span class="user"><span class="avatar av-0" id="userAvatar" aria-hidden="true"></span><span class="user-name" id="userName"></span></span>
        <button class="btn" onclick="signOut()">Sign out</button>
      </div>
    </header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Dashboard</h1>
          <div class="crumb">Tutor pipeline - <span id="crumb">All enquiries</span></div>
        </div>
        <div id="modes"></div>
      </div>
      <div id="error"></div>
      <div id="notices"></div>

      <section class="overview" aria-label="Summary for this period">
        <div class="stats" id="totals"></div>
        <div class="card chart" id="chartReplies"></div>
        <div class="card chart" id="chartDays"></div>
      </section>

      <div class="filters">
        <label>Period
          <select id="since" class="select">
            <option value="hours:24">Last 24 hours</option>
            <option value="hours:72">Last 3 days</option>
            <option value="hours:168">Last 7 days</option>
            <option value="all">All time</option>
          </select>
        </label>
        <label>Records
          <select id="scope" class="select">
            <option value="real">Real enquiries</option>
            <option value="test">Test records</option>
            <option value="all">Real and test</option>
          </select>
        </label>
        <label>Refresh
          <select id="every" class="select">
            <option value="10">Every 10 sec</option>
            <option value="30">Every 30 sec</option>
            <option value="60">Every minute</option>
            <option value="0">Off</option>
          </select>

        <span class="shown" id="shown"></span>

      <div class="workspace">
        <section class="pane list-pane" aria-label="Enquiries">
          <table class="list">
            <thead><tr>
              <th>Enquiry</th>
              <th class="col-class">Class and subjects</th>
              <th class="col-area">Area</th>
              <th>Stage</th>
              <th class="r col-count">Invited</th>
              <th class="r col-count">Yes</th>
              <th class="col-time">Received</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </section>
        <div class="detail-scrim" onclick="closeDetail()"></div>
        <section class="pane detail-pane" id="detail" aria-label="Enquiry details"></section>
      </div>
    </main>
  </div>
</div>

<script>
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const session = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
  del(k) { try { sessionStorage.removeItem(k); } catch {} },
};

let TOKEN = session.get("panel2") || "";
let USER = session.get("panel2-user") || "";
let timer = null;
let ticker = null;
let loading = false;
let lastData = null;
let lastLoadedAt = 0;
let queue = "all";
let query = "";
let selectedId = null;
let lastRowsHtml = "";
let lastDetailHtml = "";
const openTab = {};    // requirementId -> tab, so a refresh does not reset what you were reading
const previews = {};   // requirementId -> the step being previewed and what the server worked out
const results = {};    // requirementId -> how the last step went
const running = {};    // requirementId -> true while a step is running; survives a refresh

const prefs = {
  since: store.get("panel2-since") || "hours:72",
  scope: store.get("panel2-scope") || "real",
  every: store.get("panel2-every") || "30",
};

const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (d) => (d ? new Date(d).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "");
const hhmm = (d) => (d ? new Date(d).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }) : "");
const ago = (d) => {
  if (!d) return "";
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  if (m < 48 * 60) return Math.round(m / 60) + " hr ago";
  return Math.round(m / 1440) + " days ago";
};
const leftFor = (mins) => {
  if (mins == null) return "";
  const m = Math.abs(mins), h = Math.floor(m / 60), r = m % 60;
  return (h ? h + " hr " : "") + r + " min";
};
const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
const idOf = (b) => b.requirementId || (b.parentName + "|" + b.createdAt);
const km = (d) => (d != null ? esc(d) + " km" : "—");
const initials = (name) => (String(name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("") || "?").toUpperCase();
// A steady colour per person, so a name is easier to find again in the list.
const avatarTone = (name) => "av-" + ([...String(name || "")].reduce((n, c) => n + c.charCodeAt(0), 0) % 5);
const avatar = (name) => '<span class="avatar ' + avatarTone(name) + '" aria-hidden="true">' + esc(initials(name)) + "</span>";

const svg = (d, size = 19) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
const ICON = {
  all: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z"/>',
  list: '<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/>',
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  thumb: '<path d="M7 11v9H4v-9Z"/><path d="M7 11l4-8a2.5 2.5 0 0 1 2.5 2.5V9h5.3a2 2 0 0 1 2 2.4l-1.4 7a2 2 0 0 1-2 1.6H7"/>',
};

/* ---------------- What each stage means ---------------- */

const STAGES = {
  new:         { label: "New",                tone: "s-act" },
  shortlisted: { label: "Shortlisted",        tone: "s-act" },
  waiting:     { label: "Waiting for replies", tone: "s-wait" },
  due:         { label: "Ready for top 3",    tone: "s-act" },
  top3_sent:   { label: "Top 3 sent",         tone: "s-ok" },
  chosen:      { label: "Tutor confirmed",    tone: "s-ok" },
  manual:      { label: "Check shortlist",    tone: "s-bad" },
  undelivered: { label: "Not delivered",      tone: "s-bad" },
  no_replies:  { label: "No replies",         tone: "s-bad" },
};
const PROBLEMS = ["manual", "undelivered", "no_replies"];
const QUEUES = [
  { group: "Pipeline" },
  { key: "all", label: "All enquiries", icon: "all" },
  { key: "new", label: "New", icon: "inbox" },
  { key: "shortlisted", label: "Shortlisted", icon: "list" },
  { key: "waiting", label: "Waiting for replies", icon: "clock" },
  { key: "due", label: "Ready for top 3", icon: "star" },
  { key: "top3_sent", label: "Top 3 sent", icon: "send" },
  { key: "chosen", label: "Tutor confirmed", icon: "check" },
  { group: "Needs attention" },
  { key: "problems", label: "Problems", icon: "alert", problem: true },
];
const inQueue = (b, key) => key === "all" ? true : key === "problems" ? PROBLEMS.includes(b.stage) : b.stage === key;
const queueLabel = (key) => (QUEUES.find((q) => q.key === key) || {}).label || key;
const stageMark = (stage) => {
  const s = STAGES[stage] || { label: stage, tone: "s-none" };
  return '<span class="status ' + s.tone + '">' + esc(s.label) + "</span>";
};

/* ---------------- Sign in ---------------- */

async function login() {
  el("loginMsg").textContent = "";
  if (!el("u").value.trim()) { el("loginMsg").textContent = "Enter your id."; el("u").focus(); return; }
  if (!el("p").value) { el("loginMsg").textContent = "Enter your password."; el("p").focus(); return; }
  el("loginBtn").disabled = true;
  el("loginBtn").textContent = "Signing in";
  try {
    const r = await fetch("/panel2/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: el("u").value.trim(), password: el("p").value }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { el("loginMsg").textContent = j.message || "Sign in failed."; el("p").select(); return; }
    TOKEN = j.token;
    USER = j.user || el("u").value.trim();
    session.set("panel2", TOKEN);
    session.set("panel2-user", USER);
    el("p").value = "";
    show();
  } catch {
    el("loginMsg").textContent = "Could not reach the server. Check your connection and try again.";
  } finally {
    el("loginBtn").disabled = false;
    el("loginBtn").textContent = "Sign in";
  }
}

function toggleReveal() {
  const showing = el("p").type === "text";
  el("p").type = showing ? "password" : "text";
  el("reveal").textContent = showing ? "Show" : "Hide";
  el("reveal").setAttribute("aria-pressed", String(!showing));
  el("p").focus();
}

["keydown", "keyup"].forEach((type) => el("p").addEventListener(type, (e) => {
  if (e.getModifierState) el("caps").hidden = !e.getModifierState("CapsLock");
}));
el("p").addEventListener("blur", () => { el("caps").hidden = true; });

function signOut() {
  TOKEN = "";
  session.del("panel2"); session.del("panel2-user");
  clearInterval(timer); clearInterval(ticker);
  lastData = null; selectedId = null; lastRowsHtml = ""; lastDetailHtml = "";
  document.body.classList.remove("detail-open", "nav-open");
  el("boardView").hidden = true;
  el("loginView").hidden = false;
  el("u").focus();
}

function show() {
  el("loginView").hidden = true;
  el("boardView").hidden = false;
  el("userName").textContent = USER;
  el("userAvatar").textContent = initials(USER);
  if (store.get("panel2-nav") === "collapsed") document.body.classList.add("nav-collapsed");
  el("since").value = prefs.since;
  el("scope").value = prefs.scope;
  el("every").value = prefs.every;
  el("themeBtn").hidden = !window.PANEL_DARK_MODE_ENABLED;
  renderLoading();
  load();
  restart();
  clearInterval(ticker);
  ticker = setInterval(tickUpdated, 1000);
}

function toggleTheme() {
  if (!window.PANEL_DARK_MODE_ENABLED) return;
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("panel2-theme", next);
}

/* ---------------- Data ---------------- */

const isSheet = () => !window.matchMedia("(min-width: 1800px)").matches;
const isMobileNav = () => window.matchMedia("(max-width: 1099px)").matches;

function toggleNav() {
  if (isMobileNav()) document.body.classList.toggle("nav-open");
  else store.set("panel2-nav", document.body.classList.toggle("nav-collapsed") ? "collapsed" : "open");
}
function closeNav() { document.body.classList.remove("nav-open"); }
function closeDetail() { document.body.classList.remove("detail-open"); }

function restart() {
  clearInterval(timer);
  const s = Number(prefs.every);
  if (s > 0) timer = setInterval(() => { if (!document.hidden) load(); }, s * 1000);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && TOKEN && !el("boardView").hidden && Date.now() - lastLoadedAt > 10000) load();
});

async function load() {
  if (loading) return;
  loading = true;
  el("refreshBtn").disabled = true;
  try {
    const r = await fetch("/panel2/api/board?limit=100&since=" + encodeURIComponent(prefs.since) + "&scope=" + encodeURIComponent(prefs.scope), {
      headers: { Authorization: "Bearer " + TOKEN },
    });
    if (r.status === 401) { signOut(); return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { showError(j.message || "Could not load the board."); return; }
    showError("");
    lastData = j;
    lastLoadedAt = Date.now();
    render();
  } catch {
    showError("Could not reach the server. It will try again on the next refresh.");
  } finally {
    loading = false;
    el("refreshBtn").disabled = false;
    tickUpdated();
  }
}

function showError(message) {
  el("error").innerHTML = message ? '<div class="notice err" role="alert">' + esc(message) + "</div>" : "";
}

function tickUpdated() {
  if (!lastLoadedAt) { el("updated").textContent = ""; return; }
  const s = Math.round((Date.now() - lastLoadedAt) / 1000);
  el("updated").textContent = "Updated " + (s < 5 ? "just now" : s < 60 ? s + " sec ago" : Math.floor(s / 60) + " min ago");
}

/* ---------------- Page ---------------- */

function matchesQuery(b) {
  if (!query) return true;
  const hay = [b.parentName, b.phone, b.requirementId, b.area, b.subjects, b.grade].join(" ").toLowerCase();
  return query.split(/\s+/).every((word) => hay.includes(word));
}
const visibleRows = () => (lastData?.board || []).filter(matchesQuery).filter((b) => inQueue(b, queue));

function renderLoading() {
  lastRowsHtml = ""; lastDetailHtml = "";
  el("rows").innerHTML = '<tr><td colspan="7" class="loading">Loading enquiries</td></tr>';
  el("detail").innerHTML = "";
  el("totals").innerHTML = "";
  el("chartReplies").innerHTML = "";
  el("chartDays").innerHTML = "";
  el("shown").textContent = "";
}

function render() {
  if (!lastData) return;
  const all = lastData.board || [];
  const searched = all.filter(matchesQuery);
  const shown = searched.filter((b) => inQueue(b, queue));

  renderQueues(searched);
  renderModes();
  renderNotices();
  renderTotals(all);
  el("crumb").textContent = queueLabel(queue);

  el("shown").textContent = plural(shown.length, "enquiry").replace("enquirys", "enquiries") +
    (queue === "all" ? "" : " in " + queueLabel(queue)) +
    (query ? ' matching "' + query + '"' : "") +
    (lastData.capped ? " (newest " + lastData.limit + " only)" : "");

  if (!shown.some((b) => idOf(b) === selectedId)) {
    selectedId = !isSheet() && shown[0] ? idOf(shown[0]) : null;
    if (!selectedId) document.body.classList.remove("detail-open");
  }

  const rowsHtml = shown.length ? shown.map(row).join("") : listEmpty(all.length, searched.length);
  if (rowsHtml !== lastRowsHtml) {
    el("rows").innerHTML = rowsHtml;
    lastRowsHtml = rowsHtml;
  }
  renderDetail();
}

function renderQueues(rows) {
  el("queues").innerHTML = QUEUES.map((q) => {
    if (q.group) return '<div class="group">' + esc(q.group) + "</div>";
    const n = rows.filter((b) => inQueue(b, q.key)).length;
    return '<button data-queue="' + q.key + '" aria-current="' + (queue === q.key) + '"' +
      (q.problem && n ? ' class="has-problem"' : "") + ">" + svg(ICON[q.icon]) +
      '<span class="label">' + esc(q.label) + '</span><span class="n">' + n + "</span></button>";
  }).join("");
}

// The two triggers, as this server reports them.
function renderModes() {
  const a = lastData.automatic || {};
  const anyAuto = a.invites || a.topThree;
  const state = (on) => (on ? '<span class="alarm">ON</span>' : '<span class="off">Off</span>');
  el("modes").innerHTML = '<div class="modes" aria-label="Trigger settings">' +
    "<span><b>Manual trigger:</b> <span class=\"on\">On</span></span>" +
    "<span><b>Automatic invites:</b> " + state(a.invites) + "</span>" +
    "<span><b>Automatic top 3:</b> " + state(a.topThree) + "</span>" +
    "<span><b>Real sending from this panel:</b> " +
      (lastData.sendingEnabled ? '<span class="on">Allowed</span>' : '<span class="off">Off, preview only</span>') + "</span>" +
    (anyAuto ? '<span class="warning alarm">An automatic trigger is on, so messages can go out without anyone pressing a button.</span>' : "") +
    "</div>";
}

function renderNotices() {
  const p = lastData.deliveryProblem;
  el("notices").innerHTML = p
    ? '<div class="notice err" role="alert"><b>WhatsApp refused ' + plural(p.count, "message") + " on this board.</b> Most common reason: " +
      esc(p.reason) + ". Refused messages are not sent again on their own.</div>"
    : lastData.deliveryUnavailable
      ? '<div class="notice warn" role="alert"><b>Delivery status unavailable.</b> Odoo could not be reached, so this board cannot show which messages WhatsApp delivered.</div>'
      : "";
}

const percent = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "—");

function renderTotals(rows) {
  const sum = (f) => rows.reduce((n, b) => n + (f(b) || 0), 0);
  const invited = sum((b) => b.counts.invited);
  const delivered = sum((b) => b.counts.delivered);
  const undelivered = sum((b) => b.counts.undelivered);
  const interested = sum((b) => b.counts.interested);
  const noStatus = Math.max(0, invited - delivered - undelivered);
  const top3 = rows.filter((b) => b.top3 && b.top3.sent).length;
  const confirmed = rows.filter((b) => b.assignedTutor).length;
  const deliveredNote = [
    invited ? percent(delivered, invited) + " of invited" : "Nobody invited yet",
    noStatus ? noStatus + " no status" : "",
    undelivered ? '<span class="bad">' + undelivered + " not delivered</span>" : "",
  ].filter(Boolean).join(" · ");
  const items = [
    ["Enquiries", rows.length, "inbox", "st-blue", periodText()],
    ["Tutors invited", invited, "users", "st-violet", "Across " + plural(rows.filter((b) => b.counts.invited).length, "enquiry").replace("enquirys", "enquiries")],
    ["Delivered", delivered, "send", "st-teal", deliveredNote],
    ["Said yes", interested, "thumb", "st-green", invited ? percent(interested, invited) + " of invited" : "No replies yet"],
    ["Top 3 sent", top3, "star", "st-amber", top3 ? "To " + plural(top3, "parent") : "None sent yet"],
    ["Tutor confirmed", confirmed, "check", "st-pink", rows.length ? percent(confirmed, rows.length) + " of enquiries" : "None yet"],
  ];
  el("totals").innerHTML = items.map(([label, value, icon, tone, sub]) =>
    '<div class="stat ' + tone + '"><span class="tile">' + svg(ICON[icon], 22) + '</span><div style="min-width:0">' +
    '<div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + sub + "</div></div></div>").join("");
  renderReplies(rows);
  renderDays(rows);
}

const periodText = () => ({ "hours:24": "Last 24 hours", "hours:72": "Last 3 days", "hours:168": "Last 7 days", all: "All time" }[prefs.since] || "This period");

// Every number here is counted from the enquiries on the board.
function renderReplies(rows) {
  const sum = (f) => rows.reduce((n, b) => n + (f(b) || 0), 0);
  const parts = [
    ["Said yes", sum((b) => b.counts.interested), "var(--ok-mark)"],
    ["Declined", sum((b) => b.counts.notInterested), "var(--bad-mark)"],
    ["No reply", sum((b) => b.counts.waiting), "#c5ccd8"],
  ];
  const total = parts.reduce((n, p) => n + p[1], 0);
  const r = 54;
  const around = 2 * Math.PI * r;
  const shown = parts.filter((p) => p[1] > 0);
  const gap = shown.length > 1 ? 3 : 0;
  let used = 0;
  const arcs = shown.map(([label, n, colour]) => {
    const length = (n / total) * around;
    const arc = '<circle cx="68" cy="68" r="' + r + '" fill="none" stroke="' + colour + '" stroke-width="16" ' +
      'stroke-dasharray="' + Math.max(length - gap, 1) + " " + around + '" stroke-dashoffset="' + -used + '"><title>' + esc(label) + ": " + n + "</title></circle>";
    used += length;
    return arc;
  }).join("");
  el("chartReplies").innerHTML = "<h3>Tutor replies</h3>" +
    '<div class="note">Latest answer from each invited tutor</div>' +
    '<div class="donut-wrap"><div class="donut" role="img" aria-label="' + esc(parts.map((p) => p[0] + " " + p[1]).join(", ")) + '">' +
      '<svg width="136" height="136" viewBox="0 0 136 136" style="transform:rotate(-90deg)"><circle cx="68" cy="68" r="' + r + '" fill="none" stroke="var(--line-soft)" stroke-width="16"/>' + arcs + "</svg>" +
      '<div class="mid"><b>' + total + "</b><span>invited</span></div></div>" +
      '<ul class="legend">' + parts.map(([label, n, colour]) =>
        '<li><i style="background:' + colour + '"></i><span class="name">' + label + "</span><b>" + n + '</b><span class="pct">' + percent(n, total) + "</span></li>").join("") + "</ul></div>";
}

function renderDays(rows) {
  const span = { "hours:24": 2, "hours:72": 4, "hours:168": 8 }[prefs.since] || 14;
  const today = new Date();
  const days = Array.from({ length: span }, (_, i) => new Date(today.getFullYear(), today.getMonth(), today.getDate() - (span - 1 - i)));
  const key = (d) => d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  const counts = new Map(days.map((d) => [key(d), 0]));
  for (const b of rows) {
    if (!b.createdAt) continue;
    const k = key(new Date(b.createdAt));
    if (counts.has(k)) counts.set(k, counts.get(k) + 1);
  }
  const max = Math.max(1, ...counts.values());
  const label = (d) => d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  el("chartDays").innerHTML = "<h3>Enquiries received</h3>" +
    '<div class="note" style="margin-bottom:0">' + (prefs.since === "all" ? "Last 14 days" : periodText()) + "</div>" +
    '<div class="bars">' + days.map((d) => {
      const n = counts.get(key(d));
      return '<div class="day' + (n ? "" : " zero") + '" tabindex="0" aria-label="' + esc(label(d)) + ": " + plural(n, "enquiry").replace("enquirys", "enquiries") + '">' +
        '<span class="tip">' + esc(label(d)) + ": " + n + "</span>" + (n ? '<span class="val">' + n + "</span>" : "") +
        '<span class="fill" style="height:' + (n / max) * 78 + '%"></span></div>';
    }).join("") + "</div>" +
    '<div class="bars-x" aria-hidden="true">' + days.map((d, i) =>
      "<span>" + (span <= 8 || i % 2 === 0 ? esc(label(d)) : "") + "</span>").join("") + "</div>";
}

function listEmpty(total, searched) {
  const [title, text] = !total
    ? ["No enquiries in this period", "Choose a longer period above. New enquiries appear here on their own."]
    : !searched
      ? ["Nothing matches your search", "Try a parent name, phone number, requirement ID or area."]
      : ["Nothing in this queue", "No enquiry in this period is under " + queueLabel(queue) + "."];
  return '<tr><td colspan="7" class="empty-row"><b>' + esc(title) + "</b>" + esc(text) + "</td></tr>";
}

function row(b) {
  const id = idOf(b);
  return '<tr data-id="' + esc(id) + '" tabindex="0" aria-selected="' + (id === selectedId) + '">' +
    '<td><div class="person">' + avatar(b.parentName) + '<div style="min-width:0"><div class="who">' + esc(b.parentName || "(no name)") + (b.isDemo ? '<span class="test-mark">Test</span>' : "") + "</div>" +
      '<div class="sub">' + esc(b.requirementId || "No ID") + "</div></div></div></td>" +
    '<td class="col-class">' + esc(b.grade || "—") + '<div class="sub">' + esc(b.subjects || "") + "</div></td>" +
    '<td class="col-area">' + esc(b.area || "—") + "</td>" +
    "<td>" + stageMark(b.stage) + "</td>" +
    '<td class="r col-count">' + (b.counts.invited || 0) + "</td>" +
    '<td class="r col-count' + (b.counts.interested ? " count-yes" : "") + '">' + (b.counts.interested || 0) + "</td>" +
    '<td class="col-time" style="white-space:nowrap">' + esc(ago(b.createdAt)) + "</td>" +
  "</tr>";
}

/* ---------------- Detail ---------------- */

function deliveryWord(state, sendStatus) {
  const map = { read: "Read", replied: "Replied", delivered: "Delivered", sent: "Sent", outgoing: "Queued", error: "Not delivered", bounced: "Bounced", cancel: "Cancelled" };
  if (map[state]) return map[state];
  if (sendStatus === "Failed") return "Not delivered";
  return lastData && lastData.deliveryUnavailable ? "Unknown" : "No status";
}
function deliveryCell(state, reason, sendStatus, failureReason) {
  const word = deliveryWord(state, sendStatus);
  const tone = ["Read", "Replied", "Delivered"].includes(word) ? "s-ok"
    : ["Not delivered", "Bounced"].includes(word) ? "s-bad" : "s-none";
  const why = reason || (sendStatus === "Failed" ? failureReason : "");
  return '<span class="status ' + tone + '">' + word + "</span>" + (why ? '<div class="err">' + esc(why) + "</div>" : "");
}
function replyCell(reply, at) {
  const tone = reply === "Interested" || reply === "Assigned" ? "s-ok" : reply === "Not Interested" ? "s-bad" : "s-none";
  const word = reply === "Not Interested" ? "Not interested" : reply === "Interested" || reply === "Assigned" ? reply : "No reply";
  return '<span class="status ' + tone + '">' + word + "</span>" + (at ? '<div class="sub">' + esc(when(at)) + "</div>" : "");
}

function table(headers, rows) {
  return '<div class="t-wrap"><table class="tbl"><thead><tr>' + headers.map((h) => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" +
    rows.map((cells) => "<tr>" + cells.map((c, i) => "<td" + (i ? ' data-label="' + esc(headers[i]) + '"' : "") + "><div>" + c + "</div></td>").join("") + "</tr>").join("") +
    "</tbody></table></div>";
}
const tutorCell = (t, subline) => '<div class="name">' + esc(t.name || "(no name)") + '</div><div class="sub">' + esc(subline || t.code || "") + "</div>";

function invitedPanel(b) {
  if (!b.invited.length) return '<div class="none">No tutors invited yet.</div>';
  const c = b.counts;
  return '<div class="meta">' +
    (c.undelivered ? '<span class="bad">' + c.undelivered + " not delivered</span>" : "") +
    "<span>" + c.delivered + " delivered</span><span>" + c.interested + " said yes</span><span>" + c.notInterested + " declined</span><span>" + c.waiting + " no reply</span>" +
    (b.firstInviteAt ? "<span>First sent " + esc(when(b.firstInviteAt)) + "</span>" : "") + "</div>" +
    table(["Tutor", "Delivery", "Reply", "Distance", "Experience", "Invited"],
      b.invited.map((t) => [
        tutorCell(t, [t.code, t.occupation].filter(Boolean).join(" · ")),
        deliveryCell(t.delivery, t.deliveryError, t.sendStatus, t.failureReason),
        replyCell(t.reply, t.repliedAt),
        km(t.distanceKm),
        esc(t.experience || "—"),
        t.sentAt ? esc(when(t.sentAt)) : "—",
      ]));
}

function shortlistPanel(b) {
  if (!b.shortlisted) {
    return '<div class="none">' + (b.counts.invited
      ? "No shortlist on record. These tutors were invited from the admin dashboard."
      : "Not shortlisted yet.") + "</div>";
  }
  const s = b.shortlisted;
  return '<div class="meta">' +
    (s.consideredCount != null ? "<span>From " + esc(s.consideredCount) + " considered</span>" : "") +
    (s.radiusKm ? "<span>Within " + esc(s.radiusKm) + " km</span>" : "") +
    (s.at ? "<span>Made " + esc(when(s.at)) + "</span>" : "") + "</div>" +
    (b.shortlistAfterInvites
      ? '<div class="note">This shortlist was made at ' + esc(hhmm(s.at)) + ", after the invitations went out at " + esc(hhmm(b.firstInviteAt)) +
        ", so it will not fully match the invited list.</div>"
      : "") +
    (s.tutors.length
      ? table(["Tutor", "Rank", "Score", "Distance", "Experience"],
          s.tutors.map((t, i) => [
            tutorCell(t, [t.code, t.occupation].filter(Boolean).join(" · ")),
            esc(t.rank || i + 1), esc(t.score ?? "—"), km(t.distanceKm), esc(t.experience || "—"),
          ]))
      : '<div class="none">The shortlist has no tutors.</div>');
}

function top3Panel(b) {
  if (!b.top3 || !b.top3.tutors.length) return '<div class="none">Top 3 not sent to the parent yet.</div>';
  return '<div class="meta"><span>' + (b.top3.sent ? "Sent to parent " : "Attempted, not sent ") + esc(when(b.top3.at)) + "</span>" +
    (b.top3.templateName ? "<span>Template " + esc(b.top3.templateName) + "</span>" : "") + "</div>" +
    (b.top3.sent ? '<div style="margin-bottom:6px">' + deliveryCell(b.top3.delivery, b.top3.deliveryError) + "</div>" : "") +
    table(["Tutor", "Option", "Score", "Distance", "Experience"],
      b.top3.tutors.map((t, i) => [
        tutorCell(t, t.area || t.code), esc(t.choice || i + 1), esc(t.score ?? "—"), km(t.distanceKm), esc(t.experience || "—"),
      ]));
}

// The five steps, each saying what has happened and what can be pressed.
function stepList(b) {
  const c = b.counts;
  const r = b.reconfirm;
  const t3 = b.top3;
  const t3Refused = t3 && t3.sent && (t3.delivery === "error" || t3.delivery === "bounced");
  const offered = t3 && t3.sent ? t3.tutors : [];

  const nextStep = b.stage === "chosen" ? 0
    : b.stage === "top3_sent" ? (t3Refused ? 4 : 5)
    : b.stage === "due" ? 4
    : b.stage === "waiting" ? (b.canSendTop3 ? 4 : 0)
    : b.stage === "manual" ? 2
    : b.stage === "shortlisted" || b.stage === "undelivered" || b.stage === "no_replies" ? 3
    : (r && r.sent) ? 2 : 1;

  const steps = [
    {
      n: 1, title: "Re-confirm with the parent",
      result: !r ? "Not sent."
        : r.sent ? "Sent " + esc(when(r.at)) + ". " + esc(deliveryWord(r.delivery)) + ". The parent's reply is not recorded on this board."
        : "Last attempt failed: " + esc(r.failureReason || "unknown reason") + ".",
      state: r && r.sent ? (r.delivery === "error" || r.delivery === "bounced" ? "failed" : "done") : r ? "failed" : "",
      actions: [{ stage: "reconfirm", label: r && r.sent ? "Send again" : "Preview", resend: !!(r && r.sent),
        enabled: !!b.hasOdooLead && !!b.phone }],
      why: !b.hasOdooLead ? "Not synced to Odoo yet, so this cannot be sent." : !b.phone ? "No phone number." : "",
    },
    {
      n: 2, title: "Shortlist tutors",
      result: b.shortlisted
        ? plural(b.shortlisted.count, "tutor") + " saved" +
          (b.shortlisted.consideredCount != null ? " from " + b.shortlisted.consideredCount + " considered" : "") +
          (b.shortlisted.at ? ", " + esc(when(b.shortlisted.at)) : "") + "."
        : "Not shortlisted.",
      state: b.shortlisted ? "done" : "",
      actions: [{ stage: "shortlist", label: b.shortlisted ? "Redo" : "Preview", enabled: !b.assignedTutor }],
      why: b.stage === "manual" ? c.interested + " said yes but not on this shortlist, so they cannot be offered." : "",
    },
    {
      n: 3, title: "Invite tutors",
      result: c.invited
        ? plural(c.invited, "tutor") + " invited, " + c.delivered + " delivered" + (c.undelivered ? ", " + c.undelivered + " not delivered" : "") +
          ". " + c.interested + " said yes, " + c.notInterested + " declined, " + c.waiting + " no reply."
        : "Nobody invited.",
      state: b.stage === "undelivered" || b.stage === "no_replies" ? "failed" : c.invited ? "done" : "",
      actions: [{ stage: "invite", label: c.invited ? "Invite more" : "Preview", enabled: !!b.shortlisted && !b.assignedTutor }],
      why: b.assignedTutor ? "A tutor is confirmed. To start again, unassign them in the admin panel."
        : !b.shortlisted ? "Shortlist tutors first."
        : b.stage === "undelivered" ? "WhatsApp refused every invitation, so no tutor has this requirement."
        : b.stage === "no_replies" ? "The " + esc(b.waitHours) + "-hour reply window closed at " + esc(hhmm(b.windowClosesAt)) + " with no yes."
        : b.stage === "waiting" && b.minutesLeft > 0 ? "Reply window has " + esc(leftFor(b.minutesLeft)) + " left, until " + esc(hhmm(b.windowClosesAt)) + "."
        : "",
    },
    {
      n: 4, title: "Send top 3 to the parent",
      result: t3 && t3.sent
        ? "Sent " + esc(when(t3.at)) + ": " + t3.tutors.map((t) => esc(t.name)).join(", ") + ". " + esc(deliveryWord(t3.delivery)) + "."
        : t3 ? "Last attempt failed: " + esc(t3.failureReason || "unknown reason") + "."
        : b.canSendTop3 ? plural(c.interested, "tutor") + " said yes." : "Not sent.",
      state: t3Refused || (t3 && !t3.sent) ? "failed" : t3 && t3.sent ? "done" : "",
      actions: [{ stage: "top3", label: t3 && t3.sent ? "Send again" : "Preview", force: !!(t3 && t3.sent), enabled: b.canSendTop3 && !b.assignedTutor }],
      why: b.assignedTutor ? "" : !b.canSendTop3 ? (c.interested ? "Those who said yes are not on the current shortlist." : "No tutor has said yes yet.")
        : t3Refused ? "WhatsApp refused it: " + esc(t3.deliveryError || t3.delivery) + ". The parent has not received it."
        : b.stage === "waiting" ? "You can send now, or wait for more replies." : "",
    },
    {
      n: 5, title: "Confirm to the chosen tutor",
      result: b.assignedTutor ? esc(b.assignedTutor) + " is confirmed on this enquiry."
        : b.chosen ? "Parent chose " + esc(b.chosen.name) + (b.chosen.choice ? " (option " + esc(b.chosen.choice) + ")" : "") + (b.chosen.at ? ", " + esc(when(b.chosen.at)) : "") + ". Tutor not told yet."
        : "No tutor confirmed.",
      state: b.assignedTutor ? "done" : "",
      actions: offered.length && !b.assignedTutor
        ? [...offered]
            .sort((x, y) => (isParentsPick(b, y) ? 1 : 0) - (isParentsPick(b, x) ? 1 : 0))
            .map((t) => ({ stage: "selected", label: "Preview: " + t.name, tutorId: t.code, enabled: !!t.code }))
        : [{ stage: "selected", label: "Preview", enabled: false }],
      why: b.assignedTutor ? "" : !offered.length ? "Send the parent their options first." : "",
    },
  ];
  return steps.map((s) => ({ ...s, state: s.n === nextStep && s.state !== "failed" ? "next" : s.state }));
}
const isParentsPick = (b, t) => !!b.chosen && (b.chosen.code ? b.chosen.code === t.code : b.chosen.name === t.name);

function stepSection(b) {
  const busy = !!running[idOf(b)];
  const items = stepList(b).map((s) =>
    '<li class="' + (s.state ? "is-" + s.state : "") + '"><span class="no">' + s.n + "</span>" +
      '<div><div class="t">' + s.title + (s.state === "next" ? " (next)" : "") + '</div><div class="res">' + s.result + "</div>" +
        (s.why ? '<div class="why">' + s.why + "</div>" : "") + "</div>" +
      '<div class="acts">' + s.actions.map((a) =>
        '<button class="btn' + (s.state === "next" ? " btn-primary" : "") + '" data-step="' + a.stage + '"' +
        (a.tutorId ? ' data-tutor="' + esc(a.tutorId) + '"' : "") +
        (a.resend ? ' data-resend="1"' : "") + (a.force ? ' data-force="1"' : "") +
        (a.enabled && !busy ? "" : " disabled") + ">" + esc(a.label) + "</button>").join("") + "</div>" +
    "</li>").join("");
  return '<section class="sec"><h3>Steps</h3><ol class="steps">' + items + "</ol>" + previewBlock(b) + resultBlock(b) + "</section>";
}

/* ---------------- Previewing and running a step ---------------- */

const STEP_NAMES = {
  reconfirm: "Re-confirm with the parent", shortlist: "Shortlist tutors", invite: "Invite tutors",
  top3: "Send top 3 to the parent", selected: "Confirm to the tutor",
};

function kv(pairs) {
  const rows = pairs.filter(([, v]) => v != null && v !== "");
  return rows.length ? '<dl class="kv">' + rows.map(([k, v]) => "<dt>" + k + "</dt><dd>" + v + "</dd>").join("") + "</dl>" : "";
}

// Exactly what the server says would go out, for the person about to send it.
function previewBody(stage, j) {
  if (stage === "reconfirm") {
    return kv([["To", esc(j.phoneNumber)], ["Template", esc(j.templateName)], ["Odoo lead", esc(j.odooLeadId)],
        ["Reply buttons", (j.buttons || []).map(esc).join(", ")]]) +
      '<div class="msg">' + esc(j.messageBody) + "</div>";
  }
  if (stage === "shortlist") {
    return kv([["Matched", j.matchedCount + " of " + j.candidatesConsidered + " considered"], ["Will save", plural(j.tutorCount, "tutor")]]) +
      (j.tutors && j.tutors.length
        ? table(["Tutor", "Rank", "Match", "Distance", "Experience"], j.tutors.map((t) => [
            tutorCell({ name: t.name, code: t.tutorCode }, [t.tutorCode, t.occupation].filter(Boolean).join(" · ")),
            esc(t.rank), esc(t.matchPercentage != null ? t.matchPercentage + "%" : "—"), km(t.distanceKm), esc(t.experience || "—"),
          ]))
        : '<div class="none">No tutor matched this enquiry.</div>');
  }
  if (stage === "invite") {
    const sample = (j.preview || [])[0];
    return kv([["Template", esc(j.templateName)], ["Will invite", plural(j.willSend, "tutor")], ["Shortlist size", esc(j.shortlistSize)]]) +
      (j.tutors && j.tutors.length
        ? '<div class="sub-h">Who will get it</div>' + table(["Tutor", "Distance"], j.tutors.map((t) => [tutorCell({ name: t.name, code: t.tutorCode }), km(t.distanceKm)]))
        : '<div class="none">Nobody left to invite on this shortlist.</div>') +
      (j.skipped && j.skipped.length
        ? '<div class="sub-h">Skipped</div><ul class="plain-list">' + j.skipped.map((s) => "<li>" + esc(s.name) + ": " + esc(s.skipReason) + "</li>").join("") + "</ul>"
        : "") +
      (sample && sample.templateVars
        ? '<div class="sub-h">Values for ' + esc(sample.name) + "</div>" + kv(Object.entries(sample.templateVars).map(([k, v]) => [esc(k), esc(v)]))
        : "");
  }
  if (stage === "top3") {
    return kv([["Said yes", esc(j.interestedCount)], ["Will offer", plural(j.offeredCount, "tutor")]]) +
      table(["Tutor", "Option", "Distance", "Experience"], (j.tutors || []).map((t) => [
        tutorCell({ name: t.name, code: t.tutorCode }), esc(t.choice), km(t.distanceKm), esc(t.experience || "—"),
      ]));
  }
  if (stage === "selected") {
    return kv([["Tutor", esc(j.tutorName)], ["To", esc(j.phoneNumber)], ["Template", esc(j.templateName)]]) +
      '<div class="msg">' + esc(j.messageBody) + "</div>";
  }
  return "";
}

function sendLabel(stage, j) {
  if (stage === "shortlist") return "Save shortlist";
  if (stage === "invite") return "Send to " + plural(j.willSend || 0, "tutor");
  if (stage === "selected") return "Send to tutor";
  return "Send to parent";
}
const canSend = (stage, j) => stage === "shortlist" ? (j.tutorCount || 0) > 0 : stage === "invite" ? (j.willSend || 0) > 0 : true;

function previewBlock(b) {
  const p = previews[idOf(b)];
  if (!p) return "";
  const name = esc(STEP_NAMES[p.stage] || p.stage);
  if (p.loading) {
    return '<div class="preview"><div class="preview-head">Preview: ' + name + '</div><div class="preview-body mut">Working it out. Nothing is being sent.</div></div>';
  }
  const j = p.data;
  if (!p.ok) {
    return '<div class="preview"><div class="preview-head">Preview: ' + name + '<button class="btn" data-preview-close>Close</button></div>' +
      '<div class="preview-body"><div class="alert">' + esc(j.reason || j.message || "That step could not run.") + "</div></div></div>";
  }
  const messaging = p.stage !== "shortlist";
  const blockedOff = messaging && !lastData.sendingEnabled;
  const busy = !!running[idOf(b)];
  return '<div class="preview"><div class="preview-head">Preview: ' + name + '<button class="btn" data-preview-close>Close</button></div>' +
    '<div class="preview-body">' + previewBody(p.stage, j) +
      (p.stage === "shortlist" && b.shortlisted ? '<div class="note" style="margin-top:8px">Saving replaces the current shortlist. A tutor who already said yes can only be offered if they are on the new one.</div>' : "") +
    "</div>" +
    '<div class="preview-foot">' +
      '<button class="btn ' + (messaging ? "btn-send" : "btn-primary") + '" data-send' + (blockedOff || busy || !canSend(p.stage, j) ? " disabled" : "") + ">" +
        esc(busy ? "Working" : sendLabel(p.stage, j)) + "</button>" +
      '<span class="mut small">' + (blockedOff
        ? "Real sending is off on this server. Nothing can go out from this panel."
        : messaging ? "This sends real WhatsApp messages. Nothing has been sent yet."
        : "This saves the shortlist. Nobody is messaged.") + "</span>" +
    "</div></div>";
}

function resultBlock(b) {
  const r = results[idOf(b)];
  return r ? '<div class="alert ' + r.tone + '" role="status">' + r.html + "</div>" : "";
}

function describeResult(stage, j, httpOk) {
  if (!httpOk || j.ok === false) return { tone: "", html: esc(j.reason || j.message || "That step could not run.") };
  if (stage === "shortlist") {
    return j.saved ? { tone: "fine", html: "Shortlist saved: " + plural(j.tutorCount, "tutor") + "." }
      : { tone: "wait", html: esc(j.note || "Nothing was saved.") };
  }
  if (stage === "invite") {
    const failed = (j.results || []).filter((x) => !x.sent);
    return {
      tone: failed.length ? (j.sent ? "wait" : "") : "fine",
      html: "Invited " + j.sent + " of " + plural(j.willSend, "tutor") + "." +
        (failed.length ? " Failed: " + failed.map((f) => esc(f.name) + " (" + esc(f.failureReason) + ")").join(", ") + ". Press Invite more to retry them." : ""),
    };
  }
  if (j.sent) {
    return { tone: "fine", html: stage === "top3" ? "Sent to the parent: " + plural(j.offeredCount, "tutor") + "." + (j.photoCards ? " Option cards sent: " + j.cardsSent + "." : "")
      : stage === "selected" ? esc(j.tutorName) + " has been told." : "Sent to the parent." };
  }
  return { tone: "", html: "Not sent: " + esc(j.failureReason || "unknown reason") + "." };
}

async function callStage(payload) {
  const r = await fetch("/panel2/api/stage/" + encodeURIComponent(payload.stage), {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + TOKEN },
    body: JSON.stringify(payload),
  });
  if (r.status === 401) { signOut(); throw new Error("Please sign in again."); }
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
}

async function openPreview(button) {
  const b = visibleRows().find((x) => idOf(x) === selectedId);
  if (!b) return;
  const id = idOf(b);
  const payload = {
    stage: button.dataset.step, requirementId: b.requirementId, dryRun: true,
    tutorId: button.dataset.tutor || undefined,
    resend: button.dataset.resend === "1", force: button.dataset.force === "1",
  };
  delete results[id];
  previews[id] = { stage: payload.stage, payload, loading: true };
  renderDetail();
  bringPreviewIntoView();
  try {
    const { ok, data } = await callStage(payload);
    previews[id] = { stage: payload.stage, payload, ok: ok && data.ok !== false, data };
  } catch (err) {
    previews[id] = { stage: payload.stage, payload, ok: false, data: { message: err.message } };
  }
  renderDetail();
  bringPreviewIntoView();
}

// The preview opens under the steps, often below the fold of the panel.
function bringPreviewIntoView() {
  const box = el("detail").querySelector(".preview");
  if (box) box.scrollIntoView({ block: "start" });
}

async function runForReal() {
  const b = visibleRows().find((x) => idOf(x) === selectedId);
  if (!b) return;
  const id = idOf(b);
  const p = previews[id];
  if (!p || !p.ok || running[id]) return;

  if (p.stage !== "shortlist" && !window.confirm(
    sendLabel(p.stage, p.data) + " for " + b.requirementId + "?\n\nThis sends real WhatsApp messages and cannot be undone.")) return;

  running[id] = true;
  renderDetail();
  try {
    const { ok, data } = await callStage({ ...p.payload, dryRun: false });
    results[id] = describeResult(p.stage, data, ok);
    delete previews[id];
  } catch (err) {
    results[id] = { tone: "", html: esc(err.message) };
  }
  delete running[id];
  renderDetail();
  load();
}

function renderDetail() {
  const b = visibleRows().find((x) => idOf(x) === selectedId);
  const html = b ? detail(b)
    : '<div class="d-empty"><b>No enquiry selected</b>Choose one from the list to see its steps and tutors.</div>';
  if (html === lastDetailHtml) return;
  const top = el("detail").scrollTop;
  el("detail").innerHTML = html;
  el("detail").scrollTop = top;
  lastDetailHtml = html;
}

function detail(b) {
  const id = idOf(b);
  const defaultTab = b.top3 && b.top3.tutors.length ? "top3" : b.invited.length ? "invited" : "shortlist";
  const tab = openTab[id] || defaultTab;
  const tabs = [
    ["invited", "Invited", b.counts.invited],
    ["shortlist", "Shortlist", b.shortlisted ? b.shortlisted.count : 0],
    ["top3", "Top 3", b.top3 ? b.top3.tutors.length : 0],
  ];
  const panels = { invited: invitedPanel, shortlist: shortlistPanel, top3: top3Panel };
  const facts = [
    ["Phone", b.phone ? '<a href="tel:' + esc(b.phone) + '">' + esc(b.phone) + "</a>" : "—"],
    ["Class", esc(b.grade || "—")],
    ["Subjects", esc(b.subjects || "—")],
    ["Area", esc(b.area || "—")],
    ["Received", esc(when(b.createdAt) || "—")],
    ["Lead status", esc(b.status || "—")],
  ];
  return '<div class="d-head">' +
      '<button class="btn d-back" data-action="back">Back</button>' +
      avatar(b.parentName) +
      '<div class="d-title"><h2>' + esc(b.parentName || "(no name)") + (b.isDemo ? '<span class="test-mark">Test</span>' : "") + "</h2>" +
        '<div class="id">' + esc(b.requirementId || "No ID") + "</div></div>" +
      stageMark(b.stage) +
    "</div>" +
    '<section class="sec"><dl class="facts">' + facts.map(([k, v]) => "<div><dt>" + k + "</dt><dd>" + v + "</dd></div>").join("") + "</dl>" +
      (b.parentLocation && !b.parentLocation.hasCoordinates && !b.parentLocation.hasArea
        ? '<div class="alert">This enquiry has no location, so distances are blank and matching has nothing to measure from.</div>'
        : "") +
    "</section>" +
    stepSection(b) +
    '<section class="sec"><h3>Tutors</h3>' +
      '<div class="tabs" role="tablist">' + tabs.map(([key, label, n]) =>
        '<button role="tab" data-tab="' + key + '" aria-selected="' + (tab === key) + '">' + label + " (" + n + ")</button>").join("") + "</div>" +
      tabs.map(([key]) => '<div role="tabpanel" data-panel="' + key + '"' + (tab === key ? "" : " hidden") + ">" + panels[key](b) + "</div>").join("") +
    "</section>";
}

/* ---------------- Events ---------------- */

function select(id) {
  selectedId = id;
  document.querySelectorAll("#rows tr[data-id]").forEach((r) => r.setAttribute("aria-selected", String(r.dataset.id === id)));
  lastRowsHtml = el("rows").innerHTML;
  renderDetail();
  el("detail").scrollTop = 0;
  if (isSheet()) document.body.classList.add("detail-open");
}

el("queues").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-queue]");
  if (!btn) return;
  queue = btn.dataset.queue;
  closeNav();
  document.body.classList.remove("detail-open");
  render();
});

el("rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (tr) select(tr.dataset.id);
});
el("rows").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest("tr[data-id]");
  if (tr) { e.preventDefault(); select(tr.dataset.id); }
});

el("detail").addEventListener("click", (e) => {
  if (e.target.closest('[data-action="back"]')) { closeDetail(); return; }
  const step = e.target.closest("[data-step]");
  if (step && !step.disabled) { openPreview(step); return; }
  if (e.target.closest("[data-preview-close]")) { delete previews[selectedId]; renderDetail(); return; }
  const send = e.target.closest("[data-send]");
  if (send && !send.disabled) { runForReal(); return; }
  const tab = e.target.closest("[data-tab]");
  if (!tab) return;
  openTab[selectedId] = tab.dataset.tab;
  el("detail").querySelectorAll("[data-tab]").forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
  el("detail").querySelectorAll("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== tab.dataset.tab; });
  lastDetailHtml = el("detail").innerHTML;
});

el("since").addEventListener("change", () => { prefs.since = el("since").value; store.set("panel2-since", prefs.since); renderLoading(); load(); });
el("scope").addEventListener("change", () => { prefs.scope = el("scope").value; store.set("panel2-scope", prefs.scope); renderLoading(); load(); });
el("every").addEventListener("change", () => { prefs.every = el("every").value; store.set("panel2-every", prefs.every); restart(); });

let searchTimer = null;
el("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { query = el("search").value.trim().toLowerCase(); render(); }, 150);
});

window.matchMedia("(min-width: 1800px)").addEventListener("change", () => {
  document.body.classList.remove("detail-open");
  render();
});

document.addEventListener("keydown", (e) => {
  if (el("boardView").hidden) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) {
    e.preventDefault();
    el("search").focus();
  } else if (e.key === "Escape") {
    if (document.body.classList.contains("nav-open")) closeNav();
    else if (document.body.classList.contains("detail-open")) closeDetail();
    else if (document.activeElement === el("search")) { el("search").value = ""; query = ""; render(); el("search").blur(); }
  } else if (!typing && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    const ids = visibleRows().map(idOf);
    if (!ids.length) return;
    e.preventDefault();
    const at = ids.indexOf(selectedId);
    select(ids[e.key === "ArrowDown" ? Math.min(ids.length - 1, at + 1) : Math.max(0, at - 1)]);
    const tr = document.querySelector('#rows tr[aria-selected="true"]');
    if (tr) { tr.scrollIntoView({ block: "nearest" }); tr.focus(); }
  }
});

if (TOKEN) show(); else el("u").focus();
</script>
</body>
</html>
