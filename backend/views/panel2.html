function whatsappCard(d) {
  const w = d.whatsapp;
  if (!w) {
    return '<section class="pane mod-card" id="odoo-whatsapp">' + cardHead("WhatsApp in Odoo", tag("Not checked", "s-none")) +
      '<p class="mod-text">' + esc(d.whatsappSkipped || "Not checked.") + "</p></section>";
  }
  const q = w.queue;
  const accountsOk = w.accounts && w.accounts.length;
  const queueOk = q && q.found && q.active;
  const t = !accountsOk && !w.accountsError ? tag("No account", "s-bad")
    : q && q.found && !q.active ? tag("Send job off", "s-bad")
    : tag("Set up", "s-ok");
  return '<section class="pane mod-card" id="odoo-whatsapp">' + cardHead("WhatsApp in Odoo", t) +
    kvRows([
      ["Accounts", w.accountsError ? '<span class="bad-text">Could not read</span>' : accountsOk ? esc(w.accounts.join(", ")) : '<span class="bad-text">None</span>', w.accountsError],
      ["Send job", w.queueError ? '<span class="bad-text">Could not read</span>'
        : !q ? "—" : !q.found ? '<span class="bad-text">Not found</span>'
        : queueOk ? "On" + (q.every ? ' <span class="mut">(every ' + esc(q.every) + ")</span>" : "") : '<span class="bad-text">Switched off</span>',
        w.queueError || (q && q.name) || ""],
      q && q.nextCall && ["Next run", esc(when(q.nextCall))],
      ["Last message sent", w.messages?.lastSentAt ? esc(ago(w.messages.lastSentAt)) : "—", w.messages?.lastSentAt ? when(w.messages.lastSentAt) : ""],
      ["Last reply received", w.messages?.lastReplyAt ? esc(ago(w.messages.lastReplyAt)) : "—", w.messages?.lastReplyAt ? when(w.messages.lastReplyAt) : ""],
    ]) + "</section>";
}

function messagesCard(d) {
  const w = d.whatsapp;
  if (!w) return "";
  const m = w.messages;
  const period = healthPeriod(d.hours);
  if (!m) {
    return '<section class="pane mod-card" id="odoo-messages">' + cardHead("WhatsApp messages", tag("Could not read", "s-bad")) +
      '<p class="alert">' + esc(w.messagesError || "Could not read the messages.") + "</p></section>";
  }
  const t = m.stuck ? tag(m.stuck + " stuck", "s-bad")
    : m.failed ? tag(m.failed + " failed", m.failed >= 3 && m.total && m.failed / m.total >= 0.25 ? "s-bad" : "s-wait")
    : m.total ? tag("Going out", "s-ok") : tag("None sent", "s-none");
  const rows = MESSAGE_ROWS.filter(([k]) => m.byState?.[k] || ["sent", "delivered", "error"].includes(k)).map(([k, label]) => {
    const n = m.byState?.[k] || 0;
    const bad = (k === "error" || k === "bounced") && n;
    return [label, bad ? '<span class="bad-text">' + esc(num(n)) + "</span>" : esc(num(n))];
  });
  return '<section class="pane mod-card" id="odoo-messages">' + cardHead("WhatsApp messages", t) +
    '<p class="mod-text">' + esc(plural(m.total, "message")) + " sent through Odoo in the " + esc(period) + ", " + esc(m.replies + (m.replies === 1 ? " reply" : " replies")) + " received. As Odoo reports them.</p>" +
    kvRows(rows) + "</section>";
}

function flowsPane(d) {
  const flows = d.flows || [];
  const period = healthPeriod(d.hours);
  const body = flows.length
    ? '<table class="htable flows"><thead><tr><th>What</th><th class="r">New</th><th class="r">Worked</th><th class="r">Failed</th>' +
      '<th class="r c-owner">Waiting</th><th class="c-last">Last worked</th><th>Status</th></tr></thead><tbody>' +
      flows.map((f) => {
        const st = FLOW_STATUS[f.status] || FLOW_STATUS.unknown;
        const from = f.direction === "from";
        const note = f.error || (from ? f.note : f.stuck ? f.stuck + " waiting for over 10 minutes" : "");
        const noteBad = f.error || (from ? f.status !== "ok" : !!f.stuck);
        const cnt = (n) => (from || n == null ? '<span class="mut">—</span>' : esc(num(n)));
        return '<tr data-flow="' + esc(f.key) + '">' +
          '<td data-label="What" class="nm"><b>' + esc(f.label) + '</b><span class="sub">' + (from ? "From Odoo to this database" : "To " + esc(f.to)) + "</span>" +
            (note ? '<span class="' + (noteBad ? "err-text" : "sub") + '">' + esc(note) + "</span>" : "") + "</td>" +
          '<td class="r" data-label="New, ' + esc(period) + '">' + cnt(f.total) + "</td>" +
          '<td class="r" data-label="Worked">' + cnt(f.ok) + "</td>" +
          '<td class="r' + (f.failed ? " bad-text" : "") + '" data-label="Failed">' + cnt(f.failed) + "</td>" +
          '<td class="r c-owner" data-label="Waiting">' + cnt(f.waiting) + "</td>" +
          '<td class="c-last" data-label="Last worked">' + (f.lastOkAt ? '<span title="' + esc(when(f.lastOkAt)) + '">' + esc(ago(f.lastOkAt)) + "</span>" : '<span class="mut">—</span>') + "</td>" +
          '<td data-label="Status">' + tag(st.label, st.tone) + "</td></tr>";
      }).join("") + "</tbody></table>"
    : '<p class="empty-row">The database is not connected, so the sends could not be checked.</p>';
  return '<section class="pane wide-pane" id="odoo-flows">' +
    '<header class="pane-head"><div><h2>Sending to Odoo</h2><p>Each kind of record the server sends to Odoo, or sends on WhatsApp through Odoo, and what it saved about the result. ' +
    "New ones in the " + esc(period) + ".</p></div></header>" + body + "</section>";
}

function failuresPane(d) {
  const fromFlows = (d.flows || []).flatMap((f) => (f.failures || []).map((x) => ({ ...x, where: f.label })));
  const fromOdoo = (d.whatsapp?.messages?.failures || []).map((x) => ({
    at: x.at, where: "WhatsApp message in Odoo", ref: x.to ? "To " + x.to : "", name: x.template, reason: x.reason,
  }));
  const list = [...fromFlows, ...fromOdoo].sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0)).slice(0, 40);
  const period = healthPeriod(d.hours);
  const t = list.length ? tag(plural(list.length, "failure") + (list.length === 40 ? "+" : ""), "s-bad") : tag("None", "s-ok");
  const body = list.length
    ? '<table class="htable"><thead><tr><th class="c-when">When</th><th>What</th><th class="c-coll">Who</th><th>Reason</th></tr></thead><tbody>' +
      list.map((x) => '<tr class="ev-bad">' +
        '<td class="c-when" data-label="When">' + esc(when(x.at) || "—") + "</td>" +
        '<td data-label="What"><span class="cell"><b>' + esc(x.where) + "</b></span></td>" +
        '<td class="c-coll" data-label="Who"><span class="cell">' + (x.name ? esc(x.name) : "") + (x.ref ? '<span class="sub">' + esc(x.ref) + "</span>" : "") + (!x.name && !x.ref ? '<span class="mut">—</span>' : "") + "</span></td>" +
        '<td data-label="Reason" class="msg-cell"><span class="cell">' + esc(x.reason) + "</span></td></tr>").join("") + "</tbody></table>"
    : '<p class="empty-row">Nothing failed in the ' + esc(period) + ".</p>";
  return '<section class="pane wide-pane" id="odoo-failures">' +
    '<header class="pane-head"><div><h2>What failed</h2><p>Records here that did not reach Odoo, and WhatsApp messages Odoo or Meta refused, newest first. Phone numbers show their last four digits.</p></div>' + t + "</header>" +
    body + "</section>";
}

function templatesPane(d) {
  const w = d.whatsapp;
  if (!w) return "";
  const list = w.templates || [];
  const bad = list.filter((t) => t.state === "bad").length;
  const t = w.templatesError ? tag("Could not read", "s-bad") : bad ? tag(plural(bad, "problem"), "s-bad")
    : list.some((x) => x.state === "warn") ? tag("Check", "s-wait") : tag("All approved", "s-ok");
  const body = w.templatesError
    ? '<p class="alert" style="margin:14px 18px">' + esc(w.templatesError) + "</p>"
    : '<table class="htable"><thead><tr><th>Used for</th><th>Template</th><th>Status in Odoo</th></tr></thead><tbody>' +
      list.map((x) => {
        const shown = x.using || x.tried[0]?.name || "";
        const st = (x.tried.find((y) => y.name === shown) || x.tried[0] || {}).status || "missing";
        const tone = st === "approved" ? "s-ok" : x.state === "warn" ? "s-wait" : "s-bad";
        return '<tr data-template="' + esc(x.key) + '"><td data-label="Used for" class="nm"><b>' + esc(x.use) + "</b>" + (x.core ? "" : '<span class="sub">Outside the pipeline</span>') + "</td>" +
          '<td data-label="Template"><span class="cell"><code>' + esc(shown) + "</code>" + (x.note ? '<span class="sub">' + esc(x.note) + "</span>" : "") + "</span></td>" +
          '<td data-label="Status in Odoo">' + tag(TEMPLATE_LABEL[st] || st, tone) + "</td></tr>";
      }).join("") + "</tbody></table>";
  return '<section class="pane wide-pane" id="odoo-templates">' +
    '<header class="pane-head"><div><h2>WhatsApp templates</h2><p>Each message the app sends outside WhatsApp’s 24-hour reply window needs an approved template in Odoo. Where the app tries several, any one approved is enough.</p></div>' + t + "</header>" +
    body + "</section>";
}

function callsPane(d) {
  const c = d.calls;
  if (!c) return "";
  const period = healthPeriod(d.hours);
  const failing = (c.areas || []).filter((a) => a.failingNow).length;
  const t = failing ? tag(plural(failing, "kind") + " failing", "s-bad") : c.failed ? tag(plural(c.failed, "failed call"), "s-wait")
    : c.ok ? tag("All worked", "s-ok") : tag("No calls yet", "s-none");
  const areas = (c.areas || []).length
    ? '<table class="htable"><thead><tr><th>Kind</th><th class="r">Worked</th><th class="r">Failed</th><th class="r c-size">Average time</th><th class="c-last">Last worked</th><th>Status</th></tr></thead><tbody>' +
      c.areas.map((a) => '<tr data-area="' + esc(a.key) + '"><td data-label="Kind" class="nm"><b>' + esc(a.label) + "</b>" + (a.lastError ? '<span class="err-text">' + esc(a.lastError) + "</span>" : "") + "</td>" +
        '<td class="r" data-label="Worked">' + esc(num(a.ok)) + "</td>" +
        '<td class="r' + (a.failed ? " bad-text" : "") + '" data-label="Failed">' + esc(num(a.failed)) + "</td>" +
        '<td class="r c-size" data-label="Average time">' + esc(ms(a.avgMs)) + "</td>" +
        '<td class="c-last" data-label="Last worked">' + (a.lastOkAt ? '<span title="' + esc(when(a.lastOkAt)) + '">' + esc(ago(a.lastOkAt)) + "</span>" : '<span class="mut">—</span>') + "</td>" +
        '<td data-label="Status">' + (a.failingNow ? tag("Failing", "s-bad") : a.ok || a.lastOkAt ? tag("Working", "s-ok") : tag("—", "s-none")) + "</td></tr>").join("") +
      "</tbody></table>"
    : '<p class="empty-row">The server has not called Odoo since it started.</p>';
  const errs = c.errors || [];
  const errTable = errs.length
    ? '<h3 class="sub-head">Errors, newest first</h3><table class="htable"><thead><tr><th class="c-when">When</th><th>What</th><th>Message</th></tr></thead><tbody>' +
      errs.map((x) => '<tr class="ev-bad"><td class="c-when" data-label="When">' + esc(when(x.at)) + "</td>" +
        '<td data-label="What"><span class="cell"><b>' + esc(x.areaLabel) + "</b>" + '<span class="sub">' + esc(x.model ? x.model + " · " + x.op : x.op) + "</span></span></td>" +
        '<td data-label="Message" class="msg-cell"><span class="cell">' + esc(x.message) + "</span></td></tr>").join("") + "</tbody></table>"
    : "";
  return '<section class="pane wide-pane" id="odoo-calls">' +
    '<header class="pane-head"><div><h2>Calls from this server</h2><p>Every call the server made to Odoo in the ' + esc(period) + ", recorded since it started " + esc(when(c.since)) +
    ". Kept in memory, so a restart clears it.</p></div>" + t + "</header>" + areas + errTable + "</section>";
}

function healthSummary(h) {
  const s = h.summary || { bad: 0, warn: 0, ok: 0, quiet: 0, unknown: 0 };
  const db = h.database || {};
  const flagged = (h.sources || []).filter((x) => ["bad", "unknown", "warn"].includes(x.status));
  const problems = s.bad + s.unknown;

  let tone = "v-ok", icon = "check", title, sub;
  if (!db.connected) {
    tone = "v-bad"; icon = "alert";
    title = "The database is not connected";
    sub = "Nothing can be saved or checked until the server reconnects to it.";
  } else if (problems) {
    tone = "v-bad"; icon = "alert";
    title = "Problems found in " + plural(problems, "place");
    sub = "Some data is not going in properly. Each one is explained below.";
  } else if (s.warn) {
    tone = "v-warn"; icon = "alert";
    title = "Data is going in, with " + plural(s.warn, "thing") + " to check";
    sub = "Nothing is broken, but some records arrived incomplete.";
  } else {
    title = "Data is going in properly";
    sub = "Every check passed for the " + healthPeriod(h.hours) + ".";
  }

  return '<section class="card health-top" aria-label="Summary">' +
    '<div class="verdict ' + tone + '"><span class="tile">' + svg(ICON[icon], 21) + "</span>" +
      "<div><b>" + esc(title) + "</b><span>" + esc(sub) + "</span></div></div>" +
    '<div class="health-meta">' +
      "<span>Database: " + (db.connected
        ? "<b>Connected</b>" + (db.pingMs != null ? ", answered in " + esc(db.pingMs) + " ms" : "")
        : '<b class="bad">Not connected</b>') + "</span>" +
      "<span>Period: <b>" + esc(healthPeriod(h.hours)) + "</b></span>" +
      "<span>Checked: <b>" + esc(hhmm(h.generatedAt)) + "</b></span>" +
    "</div>" +
    (flagged.length
      ? '<nav class="jump" aria-label="Go to a problem">' + flagged.map((x) => {
          const st = HEALTH_STATUS[x.status];
          return '<a class="status ' + st.tone + '" href="#src-' + esc(x.key) + '">' + esc(x.label) + "</a>";
        }).join("") + "</nav>"
      : "") +
    "</section>";
}

function sourceCard(src) {
  const st = HEALTH_STATUS[src.status] || HEALTH_STATUS.unknown;
  const lastLabel = src.key === "sync" ? "Last good run" : "Last data in";
  const facts = [
    '<div><dt>' + esc(lastLabel) + '</dt><dd' + (src.lastAt ? ' title="' + esc(when(src.lastAt)) + '"' : "") + ">" +
      esc(src.lastAt ? ago(src.lastAt) : "Never") + "</dd></div>",
    ...(src.facts || []).map((f) => "<div><dt>" + esc(f.label) + "</dt><dd>" + esc(f.value) + "</dd></div>"),
  ].join("");

  // Failing checks first, worst first; passing ones keep their order below.
  const checks = [...(src.checks || [])]
    .map((c, i) => ({ c, i }))
    .sort((a, b) => {
      const ra = a.c.count > 0 ? LEVEL_ORDER[a.c.level] ?? 3 : 4;
      const rb = b.c.count > 0 ? LEVEL_ORDER[b.c.level] ?? 3 : 4;
      return ra - rb || a.i - b.i;
    })
    .map(({ c }) => checkRow(src.key, c))
    .join("");

  return '<section class="pane src" id="src-' + esc(src.key) + '" aria-labelledby="src-h-' + esc(src.key) + '">' +
    '<header class="src-head"><div><h2 id="src-h-' + esc(src.key) + '">' + esc(src.label) + "</h2>" +
      "<p>" + esc(src.from) + "</p></div>" +
      '<span class="status ' + st.tone + '">' + esc(st.label) + "</span></header>" +
    (src.error ? "" : '<dl class="src-facts">' + facts + "</dl>") +
    (src.error ? '<p class="alert">' + esc(src.error) + "</p>" : "") +
    (checks ? '<ul class="checks">' + checks + "</ul>" : "") +
    (src.sampled ? '<p class="src-foot">Checks cover the newest ' + esc(src.sampled) + " of " + esc(src.count) + " saved in this period.</p>" : "") +
    (src.status === "quiet" ? '<p class="src-foot">Nothing new was saved in the ' + esc(healthPeriod(MODULES.data.data?.hours)) + ".</p>" : "") +
    "</section>";
}

function checkRow(sourceKey, c) {
  const failing = c.count > 0;
  const level = failing ? c.level : "ok";
  const icon = level === "ok" ? "check" : level === "info" ? "info" : "alert";
  const id = sourceKey + ":" + c.key;
  const ex = c.examples || [];
  const showText = c.count > ex.length ? "Show first " + ex.length + " of " + c.count : ex.length === 1 ? "Show it" : "Show all " + ex.length;

  return '<li class="chk is-' + level + '">' +
    '<div class="chk-row">' + svg(ICON[icon], 17) +
      '<span class="chk-label">' + esc(c.label) + (failing && c.help ? '<span class="chk-help">' + esc(c.help) + "</span>" : "") + "</span>" +
      '<span class="chk-n" aria-label="' + esc(c.count) + ' found">' + esc(c.count) + "</span></div>" +
    (failing && ex.length
      ? '<details class="ex" data-check="' + esc(id) + '"' + (openChecks.has(id) ? " open" : "") + "><summary>" + esc(showText) + "</summary><ul>" +
        ex.map((x) =>
          '<li><span class="ref">' + esc(x.ref) + (x.name ? " <span>· " + esc(x.name) + "</span>" : "") + "</span>" +
          (x.at ? "<time>" + esc(when(x.at)) + "</time>" : "") +
          (x.note ? '<span class="why">' + esc(x.note) + "</span>" : "") + "</li>").join("") +
        "</ul></details>"
      : "") +
    "</li>";
}

/* ---------------- Events ---------------- */

function select(id) {
  selectedId = id;
  document.querySelectorAll("#rows tr[data-id]").forEach((r) => r.setAttribute("aria-selected", String(r.dataset.id === id)));
  lastRowsHtml = el("rows").innerHTML;
  renderDetail();
  el("detail").scrollTop = 0;
  if (isSheet()) document.body.classList.add("detail-open");
}

el("queues").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-queue]");
  if (!btn) return;
  closeNav();
  if (isModule(btn.dataset.queue)) { setView(btn.dataset.queue); window.scrollTo(0, 0); return; }
  queue = btn.dataset.queue;
  if (view !== "pipeline") { setView("pipeline"); window.scrollTo(0, 0); return; }
  document.body.classList.remove("detail-open");
  render();
});

el("healthBody").addEventListener("toggle", (e) => {
  const d = e.target;
  if (!d.matches || !d.matches("details[data-check]")) return;
  if (d.open) openChecks.add(d.dataset.check); else openChecks.delete(d.dataset.check);
}, true);

el("healthBody").addEventListener("click", (e) => {
  const b = e.target.closest('[data-action="write-test"]');
  if (b && !b.disabled) runWriteTestNow();
  const o = e.target.closest('[data-action="odoo-recheck"]');
  if (o && !o.disabled) { o.disabled = true; o.textContent = "Checking…"; loadModule("odoo", true); }
});

el("hours").addEventListener("change", () => {
  prefs.hours = el("hours").value;
  store.set("panel2-hours", prefs.hours);
  for (const key of MODULE_ORDER) MODULES[key].data = null;
  shownHtml = "";
  renderHealth();
  renderQueues();
  loadHealth();
});

el("rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (tr) select(tr.dataset.id);
});
el("rows").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest("tr[data-id]");
  if (tr) { e.preventDefault(); select(tr.dataset.id); }
});

el("detail").addEventListener("click", (e) => {
  if (e.target.closest('[data-action="back"]')) { closeDetail(); return; }
  const step = e.target.closest("[data-step]");
  if (step && !step.disabled) { openPreview(step); return; }
  if (e.target.closest("[data-preview-close]")) { delete previews[selectedId]; renderDetail(); return; }
  const send = e.target.closest("[data-send]");
  if (send && !send.disabled) { runForReal(); return; }
  const tab = e.target.closest("[data-tab]");
  if (!tab) return;
  openTab[selectedId] = tab.dataset.tab;
  el("detail").querySelectorAll("[data-tab]").forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
  el("detail").querySelectorAll("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== tab.dataset.tab; });
  lastDetailHtml = el("detail").innerHTML;
});

el("since").addEventListener("change", () => { prefs.since = el("since").value; store.set("panel2-since", prefs.since); renderLoading(); load(); });
el("scope").addEventListener("change", () => { prefs.scope = el("scope").value; store.set("panel2-scope", prefs.scope); renderLoading(); load(); });
el("every").addEventListener("change", () => { prefs.every = el("every").value; store.set("panel2-every", prefs.every); restart(); });

let searchTimer = null;
el("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { query = el("search").value.trim().toLowerCase(); render(); }, 150);
});

window.matchMedia("(min-width: 1800px)").addEventListener("change", () => {
  document.body.classList.remove("detail-open");
  render();
});

document.addEventListener("keydown", (e) => {
  if (el("boardView").hidden) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  // The enquiry shortcuts belong to the pipeline page only.
  if (view !== "pipeline" && e.key !== "Escape") return;
  if (e.key === "/" && !typing) {
    e.preventDefault();
    el("search").focus();
  } else if (e.key === "Escape") {
    if (document.body.classList.contains("nav-open")) closeNav();
    else if (document.body.classList.contains("detail-open")) closeDetail();
    else if (document.activeElement === el("search")) { el("search").value = ""; query = ""; render(); el("search").blur(); }
  } else if (!typing && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    const ids = visibleRows().map(idOf);
    if (!ids.length) return;
    e.preventDefault();
    const at = ids.indexOf(selectedId);
    select(ids[e.key === "ArrowDown" ? Math.min(ids.length - 1, at + 1) : Math.max(0, at - 1)]);
    const tr = document.querySelector('#rows tr[aria-selected="true"]');
    if (tr) { tr.scrollIntoView({ block: "nearest" }); tr.focus(); }
  }
});

if (TOKEN) show(); else el("u").focus();
</script>
</body>
</html>
